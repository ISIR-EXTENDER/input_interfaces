tablet_interface_node:
  ros__parameters:
    teleop_cmd_topic: "/teleop_cmd"
    publish_rate_hz: 100.0
    linear_scale: 0.035
    angular_scale: 0.2
    swap_xy: false
    linear_axes: [0, 1, 2]
    linear_signs: [1.0, 1.0, 1.0]
    angular_axes: [0, 1, 2]
    angular_signs: [1.0, 1.0, 1.0]
    default_mode: 0
    accept_mode_from_client: true
    state_publish_hz: 20.0
    bind_host: "0.0.0.0"
    bind_port: 8765
    ws_path: "/ws/control"
    state_machine_topic: "/petanque_state_machine/change_state"
    gripper_topic: "/gripper_controller/commands"
    gripper_open_position: 0.2
    gripper_close_position: 1.1
    hub_digital_output_topic: "/hub/digital_output"
    hub_electromagnet_channel: 2.0
    petanque_param_service: "/petanque_throw/set_parameters"
    petanque_total_duration_param: "total_duration"
    petanque_angle_between_start_and_finish_param: "angle_between_start_and_finish"
    petanque_alpha_param: "alpha"
    measure_request_image_topic: "/petanque/measure/request_image/compressed"
    measure_result_image_topic: "/petanque/measure/result_image/compressed"
    measure_result_vectors_topic: "/petanque/measure/result_vectors"
    param_call_timeout_sec: 1.5
    petanque_measurements_enabled: false
    petanque_measurement_request_image_topic: "/petanque/measure/request_image/compressed"
    petanque_measurement_points_topic: "/petanque_measurements/points"
    petanque_measurement_result_image_topic: "/petanque/measure/result_image/compressed"
    petanque_measurement_result_vectors_topic: "/petanque/measure/result_vectors"
    petanque_sphere_diameter_m: 0.073
    petanque_click_to_circle_threshold_px: 525.0
    petanque_click_search_margin_px: 180.0
    petanque_max_candidate_spheres: 20
    petanque_intrinsics_mode: "image"
    petanque_assumed_hfov_deg: 69.0
    petanque_camera_fx: 600.0
    petanque_camera_fy: 600.0
    petanque_camera_cx: 320.0
    petanque_camera_cy: 240.0
    petanque_blur_kernel_size: 5
    petanque_hough_dp: 1.0
    petanque_hough_min_dist_px: 150.0
    petanque_hough_param1: 80.0
    petanque_hough_param2: 40.0
    petanque_min_radius_px: 30
    petanque_max_radius_px: 200
