joystick_mapper:
  ros__parameters:
    joy_topic: "/joy"
    output_topic: "/physical_joystick_cartesian_command"
    mode_request_topic: "/mode_request"
    deadzone: 0.2
    local_mode_button_index: 1
    local_mode_button_mode: toggle
    modes:
      names: ["b1", "b2"]
      b1:
        angular_output_frame_id: "base_link"
        axes:
          linear_x:
            index: 1
            scale: 1.0
          linear_y:
            index: 0
            scale: 1.0
          linear_z:
            index: 2
            scale: 1.0
          angular_x:
            index: -1
            scale: 1.0
          angular_y:
            index: -1
            scale: 1.0
          angular_z:
            index: -1
            scale: 1.0
      b2:
        angular_output_frame_id: "effector_frame"
        axes:
          linear_x:
            index: -1
            scale: 1.0
          linear_y:
            index: -1
            scale: 1.0
          linear_z:
            index: -1
            scale: 1.0
          angular_x:
            index: 1
            scale: 1.0
          angular_y:
            index: 0
            scale: 1.0
          angular_z:
            index: 2
            scale: 1.0
    jaco_button_index: 11
    jaco_button_mode: toggle
    snake_button_index: 10
    snake_button_mode: hold
    home_button_index: 4
    home_button_mode: hold
    gripper_button_index: 0
    gripper_button_mode: toggle
    gripper_command_topic: "/gripper_controller/commands"
    gripper_open_position: 0.2
    gripper_close_position: 1.1
    scale_increase_button_index: 3
    scale_increase_button_mode: trigger
    scale_decrease_button_index: 2
    scale_decrease_button_mode: trigger
    general_scale: 0.4
    max_general_scale: 1.0
    min_general_scale: 0.1
    increment_general_scale: 0.1
    
    debug: false
