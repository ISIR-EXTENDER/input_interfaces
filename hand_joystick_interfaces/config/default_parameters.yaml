hand_joystick_interface:
  ros__parameters:
    dead_zone: 0.05
    saturation_zone: 0.2  # XY distance from reference where output saturates at ±1
    normalization_mode: "vector"  # Options: axis, vector
    landmark_index: 8  # 0=wrist, 8=index finger tip, 9=middle finger MCP
    output_round_decimals: 2
    joy_output_topic: "/hand_joy"
    cartesian_command_topic: "/joystick_cartesian_command"
    enable_marker_visualization: true  # Set to false to disable RViz marker visualization
    teleop_cmd_marker_topic: "teleop_cmd_marker"
    teleop_cmd_marker_frame_id: "base_link"
    teleop_cmd_marker_scale_x: 0.03
    teleop_cmd_marker_scale_y: 0.07
    teleop_cmd_marker_scale_z: 0.07
