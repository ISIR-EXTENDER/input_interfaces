hand_joystick_interface:
  ros__parameters:
    dead_zone: 0.02
    saturation_zone: 0.25  # XYZ joystick distance where output saturates at +/-1
    normalization_mode: "axis"
    landmark_index: 0  # 0=wrist, 8=index finger tip, 9=middle finger MCP
    output_round_decimals: 2
    joy_output_topic: "/hand_joy"
    cartesian_command_topic: "/joystick_cartesian_command"
    enable_marker_visualization: true
    teleop_cmd_marker_topic: "teleop_cmd_marker"
    teleop_cmd_marker_frame_id: "base_link"
    teleop_cmd_marker_scale_x: 0.03
    teleop_cmd_marker_scale_y: 0.07
    teleop_cmd_marker_scale_z: 0.07
    lost_hand_cooldown_sec: 0.2

oak_hand_landmarks_node:
  ros__parameters:
    # Producer display policy; control metrics are mirrored by the launch file.
    show_control_overlay: true
    auto_reference_on_first_detection: true
    reset_reference_topic: "/reset_reference"
    reset_reference_cooldown_sec: 0.25
