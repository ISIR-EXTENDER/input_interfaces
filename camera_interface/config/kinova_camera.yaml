# The Kinova gen3's integrated camera, served by the kinova_vision package.
#
# It needs no parameters from here. Its own launch file owns the RTSP stream configuration, the
# colour and depth nodes, and the calibration defaults, so camera_interface includes that launch
# rather than respawning the node:
#
#   ros2 launch camera_interface camera.launch.py driver:=kinova_vision
#
# It already publishes /camera/color/image_raw, /camera/color/camera_info and
# /camera/color/image_raw/compressed, so nothing is remapped. driver:=none is equivalent when the
# camera was started by hand.
#
# The TF caveat is in the Readme: enabling `vision` on the description and running this launch
# both claim camera_color_frame, and the gen3.xacro the manager uses leaves vision off.
