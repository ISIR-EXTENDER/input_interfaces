<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mouse Joystick Interface</title>
  <style>
    body {
      display: flex;
      margin: 2% 2% 10% 10%;
      background: #111;
      color: #f5f5f5;
      font-family: sans-serif;
      user-select: none;
      gap: 15%;
      justify-content: space-evenly;
      overflow: hidden;
    }

    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .pad {
      flex-shrink: 0;
      width: var(--joystick-diameter, 400px);
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid #666;
      position: relative;
      background: #1e1e1e;
      touch-action: none;
      cursor: crosshair;
    }

    .knob {
      width: min(70px, 30%);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #3fa9f5;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .values {
      font-size: 18px;
      min-width: 220px;
      text-align: center;
    }

    .mode-toggle {
      font-size: 16px;
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #666;
      background: #2a2a2a;
      color: #f5f5f5;
      cursor: pointer;
    }

    .button-grid {
      --button-width: 89px;
      --button-height: 44px;
      width: calc(var(--button-width) + var(--button-width) + var(--button-width) + var(--button-width) + 24px);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .button-grid[hidden] {
      display: none;
    }

    .joy-button {
      min-width: 0;
      min-height: var(--button-height);
      border-radius: 8px;
      border: 1px solid #666;
      background: #2a2a2a;
      color: #f5f5f5;
      font-size: 16px;
      font-weight: 600;
      overflow-wrap: anywhere;
      cursor: pointer;
      touch-action: none;
    }

    .joy-button.active {
      border-color: #3fa9f5;
      background: #176da8;
    }

    .joy-button[data-button-type="toggle"] {
      border: 2px solid #d89b2b;
      border-radius: 999px;
      background: #33260d;
      color: #ffd980;
      box-shadow: inset 0 0 0 1px rgb(255 217 128 / 12%);
    }

    .joy-button[data-button-type="toggle"]::after {
      content: "TOGGLE";
      display: block;
      margin-top: 2px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      line-height: 1;
      opacity: 0.78;
    }

    .joy-button[data-button-type="toggle"].active {
      border-color: #ffd05a;
      background: #d89b2b;
      color: #171006;
      box-shadow: 0 0 14px rgb(255 208 90 / 38%);
    }

    .joy-button:focus-visible {
      outline: 3px solid #f5f5f5;
      outline-offset: 2px;
    }

    body.joy-output .pad {
      width: min(92vw, calc(100vh - 285px));
      height: min(92vw, calc(100vh - 285px));
    }

    .centered {
      text-align: center;
    }

    .sliders {
      background-color: #2a2a2a;
      border-radius: 10pt;
      overflow: scroll;
      display: flex;
      justify-content: space-evenly;
      flex-direction: column;
      width: 40%;
      height: auto;
      margin-right: 8rem;
      padding: 1rem 2rem 2rem 2rem;
      gap: 0.2rem;
    }

    .joint-value {
      font-size: medium;
      color: black;
      background-color: white;
      text-align: center;
      padding: 5pt;
      border-radius: 15pt;
      width: 4rem;
      box-sizing: border-box;
    }

    .joint-button {
      min-height: 44px;
      border-radius: 8px;
      border: 1px solid #666;
      background: #2a2a2a;
      color: #f5f5f5;
      margin-top: 5%;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      touch-action: none;
    }

    .joint-button.active {
      border-color: #3fa9f5;
      background: #176da8;
    }

    .joint-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .joint-track {
      flex: 1;
      min-width: 0;
      position: relative;
    }

    .joint-slider {
      width: 100%;
      height: 8px;
      border-radius: 5px;
      background: #444;
      cursor: pointer;
      touch-action: none;
    }

    .joint-slider:focus {
      outline: none;
    }

    .joint-marker {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      border-radius: 2px;
      height: 20px;
      background: #ff5252;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
    }

    .joint-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .joint-refresh-button,
    .joint-refresh-all-button {
      padding: 6px 10px;
      border: 1px solid #666;
      border-radius: 6px;
      background: #2a2a2a;
      color: #f5f5f5;
      cursor: pointer;
    }

    .joint-refresh-all-button {
      align-self: flex-end;
      width: fit-content;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="activeMode" class="values" aria-live="polite">Mode: —</div>
    <button id="modeToggle" class="mode-toggle">Interaction: Click</button>
    <div id="pad" class="pad">
      <div id="knob" class="knob"></div>
    </div>
    <div id="values" class="values">x: 0.00, y: 0.00</div>
    <div id="joyButtons" class="button-grid" hidden>
      <button class="joy-button" data-button-index="0" aria-pressed="false">0</button>
      <button class="joy-button" data-button-index="1" aria-pressed="false">1</button>
      <button class="joy-button" data-button-index="2" aria-pressed="false">2</button>
      <button class="joy-button" data-button-index="3" aria-pressed="false">3</button>
      <button class="joy-button" data-button-index="4" aria-pressed="false">4</button>
      <button class="joy-button" data-button-index="5" aria-pressed="false">5</button>
      <button class="joy-button" data-button-index="6" aria-pressed="false">6</button>
      <button class="joy-button" data-button-index="7" aria-pressed="false">7</button>
      <button class="joy-button" data-button-index="8" aria-pressed="false">8</button>
      <button class="joy-button" data-button-index="9" aria-pressed="false">9</button>
      <button class="joy-button" data-button-index="10" aria-pressed="false">10</button>
      <button class="joy-button" data-button-index="11" aria-pressed="false">11</button>
    </div>
  </div>

  <div id="sliders" class="sliders">
    <h2 class="centered">Joint Sliders</h2>
    <button type="button" id="joint-refresh-all-button" class="joint-refresh-all-button">
      Refresh all
    </button>
    <div class="joint-title">
      <h3>Joint 1</h3>
      <button type="button" class="joint-refresh-button" data-joint-index="0"
        aria-label="Refresh Joint 1 position">Refresh</button>
    </div>
    <div class="joint-control">
      <div class="joint-track">
        <input class="joint-slider" type="range" value="0" min="-166" max="166" step="1">
        <span class="joint-marker" aria-hidden="true" hidden></span>
      </div>
      <input class="joint-value" type="number" value="0" step="1" aria-label="Joint 1 position in degrees">
    </div>
    <div class="joint-title">
      <h3>Joint 2</h3>
      <button type="button" class="joint-refresh-button" data-joint-index="1"
        aria-label="Refresh Joint 2 position">Refresh</button>
    </div>
    <div class="joint-control">
      <div class="joint-track">
        <input class="joint-slider" type="range" value="0" min="-122" max="122" step="1">
        <span class="joint-marker" aria-hidden="true" hidden></span>
      </div>
      <input class="joint-value" type="number" value="0" step="1" aria-label="Joint 2 position in degrees">
    </div>
    <div class="joint-title">
      <h3>Joint 3</h3>
      <button type="button" class="joint-refresh-button" data-joint-index="2"
        aria-label="Refresh Joint 3 position">Refresh</button>
    </div>
    <div class="joint-control">
      <div class="joint-track">
        <input class="joint-slider" type="range" value="0" min="-166" max="166" step="1">
        <span class="joint-marker" aria-hidden="true" hidden></span>
      </div>
      <input class="joint-value" type="number" value="0" step="1" aria-label="Joint 3 position in degrees">
    </div>
    <div class="joint-title">
      <h3>Joint 4</h3>
      <button type="button" class="joint-refresh-button" data-joint-index="3"
        aria-label="Refresh Joint 4 position">Refresh</button>
    </div>
    <div class="joint-control">
      <div class="joint-track">
        <input class="joint-slider" type="range" value="0" min="-166" max="166" step="1">
        <span class="joint-marker" aria-hidden="true" hidden></span>
      </div>
      <input class="joint-value" type="number" value="0" step="1" aria-label="Joint 4 position in degrees">
    </div>
    <div class="joint-title">
      <h3>Joint 5</h3>
      <button type="button" class="joint-refresh-button" data-joint-index="4"
        aria-label="Refresh Joint 5 position">Refresh</button>
    </div>
    <div class="joint-control">
      <div class="joint-track">
        <input class="joint-slider" type="range" value="0" min="-97" max="97" step="1">
        <span class="joint-marker" aria-hidden="true" hidden></span>
      </div>
      <input class="joint-value" type="number" value="0" step="1" aria-label="Joint 5 position in degrees">
    </div>
    <div class="joint-title">
      <h3>Joint 6</h3>
      <button type="button" class="joint-refresh-button" data-joint-index="5"
        aria-label="Refresh Joint 6 position">Refresh</button>
    </div>
    <div class="joint-control">
      <div class="joint-track">
        <input class="joint-slider" type="range" value="0" min="-166" max="166" step="1">
        <span class="joint-marker" aria-hidden="true" hidden></span>
      </div>
      <input class="joint-value" type="number" value="0" step="1" aria-label="Joint 6 position in degrees">
    </div>
    <button id="joint-button" class="joint-button" aria-pressed="false">GO</button>
  </div>

  <script>
    const pad = document.getElementById('pad');
    const layout = document.querySelector('.wrap');
    const knob = document.getElementById('knob');
    const values = document.getElementById('values');
    const modeToggle = document.getElementById('modeToggle');
    const activeMode = document.getElementById('activeMode');
    const joyButtonGrid = document.getElementById('joyButtons');
    const joyButtonElements = Array.from(document.querySelectorAll('.joy-button'));
    const jointSliderElements = Array.from(document.querySelectorAll('.joint-slider'));
    const jointValueElements = Array.from(document.querySelectorAll('.joint-value'));
    const jointMarkerElements = Array.from(document.querySelectorAll('.joint-marker'));
    const jointGoButton = document.getElementById('joint-button');
    const jointRefreshButtons = Array.from(document.querySelectorAll('.joint-refresh-button'));
    const jointRefreshAllButton = document.getElementById('joint-refresh-all-button');

    let dragging = false;
    let hoverActive = false;
    let configurationReady = false;
    let lastSent = 0;
    let holdSendTimer = null;
    let interactionMode = 'click';
    let latestTeleop = { x: 0, y: 0 };
    let joyButtonTypes = Array(12).fill('press');
    let layoutScale = 1;
    let layoutReduced = false;
    let layoutReady = false;
    const joyButtonState = Array(12).fill(0);
    const jointSlidersState = Array(6).fill(0);
    const activePressPointers = new Map();
    let robotPosition = null;
    let JointGoButtonState = false;

    // Publish at roughly 30 Hz while the joystick or any Joy button is held.
    const sendIntervalMs = 33;
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    /** Fit the unscaled layout in the viewport without changing its proportions. */
    function fitLayout() {
      if (!layoutReady) return;
      const width = layout.offsetWidth;
      const height = layout.offsetHeight;
      if (!width || !height || !window.innerWidth || !window.innerHeight) return;
      layoutScale = Math.min(1, window.innerWidth / width, window.innerHeight / height);
      layout.style.setProperty('--layout-scale', layoutScale);
      const reduced = layoutScale < 0.999999;
      if (reduced && !layoutReduced) {
        fetch('/layout-warning', { method: 'POST' }).catch(() => { });
      }
      layoutReduced = reduced;
    }

    window.addEventListener('resize', fitLayout);
    new ResizeObserver(fitLayout).observe(layout);

    /**
     * Send normalized joystick coordinates to the ROS bridge endpoint.
     *
     * @param {number} x - Normalized forward/backward command in [-1, 1].
     * @param {number} y - Normalized left/right command in [-1, 1].
     */
    function sendTeleop(x, y) {
      fetch('/teleop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ x, y, buttons: joyButtonState, sliders: jointSlidersState, JointGoButton: JointGoButtonState }),
        keepalive: true
      }).catch(() => { });
    }

    /** Re-send the most recent joystick command and update the throttle clock. */
    function sendLatestTeleop() {
      sendTeleop(latestTeleop.x, latestTeleop.y);
      lastSent = performance.now();
    }

    /** Stop the repeated sender when no joystick or button is active. */
    function stopHoldSend() {
      if (holdSendTimer === null) return;
      clearInterval(holdSendTimer);
      holdSendTimer = null;
    }

    /** Return whether an active joystick or button needs repeated publishing. */
    function shouldRepeatSend() {
      const joystickHeld = (dragging && interactionMode === 'click') ||
        (hoverActive && interactionMode === 'hover');
      return joystickHeld || joyButtonState.some((value) => value === 1) || JointGoButtonState;
    }

    /** Keep a roughly 30 Hz sender active while the joystick or a button is held. */
    function updateHoldSend() {
      if (!shouldRepeatSend()) {
        stopHoldSend();
        return;
      }
      if (holdSendTimer !== null) return;

      holdSendTimer = setInterval(() => {
        if (!shouldRepeatSend()) {
          stopHoldSend();
          return;
        }
        sendLatestTeleop();
      }, sendIntervalMs);
    }

    /**
     * Move the visual joystick and publish its normalized coordinates.
     *
     * @param {number} clientX - Pointer x-coordinate in viewport pixels.
     * @param {number} clientY - Pointer y-coordinate in viewport pixels.
     * @param {Object} [options] - Update options.
     * @param {boolean} [options.forceSend=false] - Bypass the send throttle.
     */
    function updateJoystick(clientX, clientY, { forceSend = false } = {}) {
      const rect = pad.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const radius = rect.width / 2;
      const knobRadius = knob.getBoundingClientRect().width / 2;
      const maxTravel = Math.max(layoutScale, radius - knobRadius);

      let dx = clientX - cx;
      let dy = clientY - cy;

      const distance = Math.hypot(dx, dy);
      // Keep the knob inside the circular pad while preserving direction.
      if (distance > maxTravel) {
        const scale = maxTravel / distance;
        dx *= scale;
        dy *= scale;
      }

      const x = clamp(dx / maxTravel, -1, 1);
      // DOM y grows downward; teleop y is positive upward on the pad.
      const y = clamp(-dy / maxTravel, -1, 1);

      knob.style.left = `calc(50% + ${dx / layoutScale}px)`;
      knob.style.top = `calc(50% + ${dy / layoutScale}px)`;
      values.textContent = `x: ${x.toFixed(2)}, y: ${y.toFixed(2)}`;
      latestTeleop = { x, y };

      const now = performance.now();
      if (forceSend || now - lastSent >= sendIntervalMs) {
        sendLatestTeleop();
      }
    }

    /** Return the UI and published command to the neutral joystick position. */
    function centerJoystick() {
      knob.style.left = '50%';
      knob.style.top = '50%';
      values.textContent = 'x: 0.00, y: 0.00';
      latestTeleop = { x: 0, y: 0 };
      sendTeleop(0, 0);
    }

    pad.addEventListener('pointerdown', (event) => {
      if (interactionMode !== 'click' || event.button !== 0) return;
      dragging = true;
      pad.setPointerCapture(event.pointerId);
      updateJoystick(event.clientX, event.clientY, { forceSend: true });
      updateHoldSend();
    });

    pad.addEventListener('pointermove', (event) => {
      if (interactionMode === 'click' && !dragging) return;
      if (interactionMode === 'hover' && !hoverActive) return;
      updateJoystick(event.clientX, event.clientY);
    });

    const stop = (event) => {
      if (interactionMode !== 'click') return;
      if (event && pad.hasPointerCapture(event.pointerId)) {
        pad.releasePointerCapture(event.pointerId);
      }
      if (!dragging) return;
      dragging = false;
      centerJoystick();
      updateHoldSend();
    };

    pad.addEventListener('pointerenter', (event) => {
      if (interactionMode !== 'hover') return;
      hoverActive = true;
      updateJoystick(event.clientX, event.clientY, { forceSend: true });
      updateHoldSend();
    });

    function stopHover() {
      if (!hoverActive) return;
      hoverActive = false;
      centerJoystick();
      updateHoldSend();
    }

    pad.addEventListener('pointerleave', stopHover);

    pad.addEventListener('pointerup', stop);
    pad.addEventListener('pointercancel', stop);
    pad.addEventListener('lostpointercapture', stop);
    pad.addEventListener('contextmenu', () => stop());

    modeToggle.addEventListener('click', () => {
      interactionMode = interactionMode === 'click' ? 'hover' : 'click';
      modeToggle.textContent = interactionMode === 'click' ? 'Interaction: Click' : 'Interaction: Mouseover';
      dragging = false;
      hoverActive = false;
      centerJoystick();
      updateHoldSend();
    });

    /** Update one Joy button and immediately publish the complete current state. */
    function setJoyButtonState(index, pressed) {
      const value = pressed ? 1 : 0;
      if (joyButtonState[index] === value) return;

      joyButtonState[index] = value;
      const element = joyButtonElements[index];
      element.classList.toggle('active', pressed);
      element.setAttribute('aria-pressed', pressed ? 'true' : 'false');
      sendLatestTeleop();
      updateHoldSend();
    }

    function setJointGoButtonState(pressed) {
      jointGoButton.classList.toggle('active', pressed);
      JointGoButtonState = pressed;
      setJointSlidersState();
    }

    jointGoButton.addEventListener('pointerdown', (event) => { setJointGoButtonState(true); })
    jointGoButton.addEventListener('pointerup', (event) => { setJointGoButtonState(false); })

    jointSliderElements.forEach((slider, index) => {
      const valueInput = jointValueElements[index];
      valueInput.min = slider.min;
      valueInput.max = slider.max;
      valueInput.step = slider.step;

      slider.addEventListener('input', () => {
        valueInput.value = slider.value;
      });

      valueInput.addEventListener('input', () => {
        const numericValue = valueInput.valueAsNumber;
        if (!Number.isFinite(numericValue)) return;

        slider.value = String(clamp(
          Math.round(numericValue),
          Number(slider.min),
          Number(slider.max),
        ));
        valueInput.value = slider.value;
      });

      valueInput.addEventListener('change', () => {
        if (valueInput.value === '') valueInput.value = slider.value;
      });
    });

    function setJointSlidersState() {

      for (let index = 0; index < jointSlidersState.length; index++) {
        jointSlidersState[index] = Number(jointSliderElements[index].value) / 180 * 3.14;

      }
      sendLatestTeleop();
      updateHoldSend();
    }

    function refreshJointSlider(index) {
      if (!Number.isInteger(index) || index < 0 || index >= jointSliderElements.length) return;

      const positionRadians = robotPosition?.[`joint_${index + 1}`];
      if (!Number.isFinite(positionRadians)) return;

      const slider = jointSliderElements[index];
      const positionDegrees = Math.round(positionRadians * 180 / Math.PI);
      slider.value = String(clamp(positionDegrees, Number(slider.min), Number(slider.max)));
      slider.dispatchEvent(new Event('input', { bubbles: true }));
    }

    jointRefreshButtons.forEach((button) => {
      const index = Number(button.dataset.jointIndex);
      button.addEventListener('click', () => refreshJointSlider(index));
    });

    jointRefreshAllButton.addEventListener('click', () => {
      jointSliderElements.forEach((_, index) => refreshJointSlider(index));
    });


    /** Release a press-type button owned by a pointer, including cancellations. */
    function releasePressPointer(event) {
      const index = activePressPointers.get(event.pointerId);
      if (index === undefined) return;

      activePressPointers.delete(event.pointerId);
      setJoyButtonState(index, false);
    }

    joyButtonElements.forEach((button) => {
      const index = Number(button.dataset.buttonIndex);
      button.addEventListener('pointerdown', (event) => {
        if (!configurationReady) return;
        event.preventDefault();

        if (joyButtonTypes[index] === 'toggle') {
          setJoyButtonState(index, joyButtonState[index] === 0);
          return;
        }

        if (joyButtonState[index] === 1) return;
        activePressPointers.set(event.pointerId, index);
        button.setPointerCapture(event.pointerId);
        setJoyButtonState(index, true);
      });
      button.addEventListener('pointerup', releasePressPointer);
      button.addEventListener('pointercancel', releasePressPointer);
      button.addEventListener('lostpointercapture', releasePressPointer);
    });

    /** Release active press buttons without changing latched toggle buttons. */
    function releaseActivePressButtons() {
      const pressedIndexes = new Set(activePressPointers.values());
      activePressPointers.clear();
      let changed = false;
      pressedIndexes.forEach((index) => {
        if (joyButtonState[index] === 0) return;
        changed = true;
        joyButtonState[index] = 0;
        joyButtonElements[index].classList.remove('active');
        joyButtonElements[index].setAttribute('aria-pressed', 'false');
      });
      if (!changed) return;
      sendLatestTeleop();
      updateHoldSend();
    }

    function handleWindowExit() {
      stop();
      stopHover();
      releaseActivePressButtons();
    }

    window.addEventListener('blur', handleWindowExit);
    window.addEventListener('pagehide', handleWindowExit);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        handleWindowExit();
      }
    });

    function pollActiveMode() {
      fetch('/active_mode', { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error('Failed to load active mode');
          return response.json();
        })
        .then((state) => {
          activeMode.textContent = `Mode: ${typeof state.active_mode === 'string' && state.active_mode ? state.active_mode : '—'}`;
        })
        .catch(() => { })
        .finally(() => setTimeout(pollActiveMode, 500));
    }
    pollActiveMode();

    function pollRobotPosition() {
      fetch('/robot_position', { cache: 'no-store' })
        .then((response) => {
          if (!response.ok) throw new Error('Failed to load robot position');
          return response.json();
        })
        .then((state) => {
          robotPosition = state.robot_position;
          jointSliderElements.forEach((slider, index) => {
            const marker = jointMarkerElements[index];
            const positionRadians = robotPosition?.[`joint_${index + 1}`];
            if (!Number.isFinite(positionRadians)) {
              marker.hidden = true;
              return;
            }

            const positionDegrees = positionRadians * 180 / Math.PI;
            const min = Number(slider.min);
            const max = Number(slider.max);
            const ratio = clamp((positionDegrees - min) / (max - min), 0, 1);
            marker.style.left = `${ratio * 100}%`;
            marker.title = `Robot position: ${positionDegrees.toFixed(1)}°`;
            marker.hidden = false;
          });
        })
        .catch(() => { })
        .finally(() => setTimeout(pollRobotPosition, 100));
    }
    pollRobotPosition();

    fetch('/config', { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error('Failed to load output configuration');
        return response.json();
      })
      .then((config) => {
        interactionMode = config.interaction_mode === 'mouseover' ? 'hover' : 'click';
        modeToggle.textContent = interactionMode === 'click' ? 'Interaction: Click' : 'Interaction: Mouseover';
        const diameter = config.joystick_diameter_px;
        if (Number.isSafeInteger(diameter) && diameter > 0) {
          pad.style.setProperty('--joystick-diameter', `${diameter}px`);
        }
        const width = config.joy_button_width_px;
        const height = config.joy_button_height_px;
        if (Number.isSafeInteger(width) && width > 0) {
          joyButtonGrid.style.setProperty('--button-width', `${width}px`);
        }
        if (Number.isSafeInteger(height) && height > 0) {
          joyButtonGrid.style.setProperty('--button-height', `${height}px`);
        }
        const configuredTypes = config.joy_button_types;
        const validTypes = Array.isArray(configuredTypes)
          && configuredTypes.length === joyButtonElements.length
          && configuredTypes.every((type) => type === 'press' || type === 'toggle');
        if (!validTypes) throw new Error('Invalid Joy button configuration');

        joyButtonTypes = configuredTypes;
        const labels = config.joy_button_labels;
        joyButtonElements.forEach((button, index) => {
          const buttonType = joyButtonTypes[index];
          const label = Array.isArray(labels) && typeof labels[index] === 'string'
            && labels[index] ? labels[index] : String(index);
          button.textContent = label;
          button.dataset.buttonType = buttonType;
          button.title = `${label} (button ${index}, ${buttonType})`;
          button.setAttribute('aria-label', `${label}, button ${index}, ${buttonType}`);
        });
        configurationReady = true;
        joyButtonGrid.hidden = false;
        layoutReady = true;
        fitLayout();
        sendLatestTeleop();
      })
      .catch(() => {
        configurationReady = false;
        joyButtonGrid.hidden = true;
      });
  </script>
</body>

</html>
